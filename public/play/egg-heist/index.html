    (function () {
      function show(msg) {

          d = document.createElement('div');
          d.id = 'err';

        }
        d.textContent += msg + String.fromCharCode(10);
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) show('Failed to load: ' + (t.src || t.href));
        else show('Error: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.stack || e.reason))); });
